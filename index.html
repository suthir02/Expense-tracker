<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Expense Tracker</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Left Side -->
    <div class="left">

        <h1>INCOME EXPENSE TRACKER</h1>

        <h3>Your Balance</h3>
        <h2 id="balance">₹0.00</h2>

        <div class="summary">

            <div class="income-box">
                <h3>INCOME</h3>
                <h2 id="income">₹0.00</h2>
            </div>

            <div class="expense-box">
                <h3>EXPENSE</h3>
                <h2 id="expense">₹0.00</h2>
            </div>

        </div>

        <form id="form">

            <label>Description</label>
            <input
                type="text"
                id="text"
                placeholder="Enter Description"
                required
            >

            <label>Amount</label>
            <input
                type="number"
                id="amount"
                placeholder="Amount"
                required
            >

            <small>
                Enter positive value for Income<br>
                Enter negative value for Expense
            </small>

            <button>Add Transaction</button>

        </form>

    </div>

    <!-- Right Side -->

    <div class="right">

        <h2>TRANSACTION DETAILS</h2>

        <ul id="list">

            <!-- JavaScript will add transactions here -->

        </ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
